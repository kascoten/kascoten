<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Details — KASCOTE</title>
  <meta name="description" content="Full details, media gallery, and countdown for KASCOTE upcoming events." />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@700&family=Alegreya:wght@400;500;700&display=swap" rel="stylesheet" />
  <!-- Icons -->
  <script src="https://kit.fontawesome.com/5da3338349.js" crossorigin="anonymous"></script>
  <!-- Shared nav styles -->
  <link rel="stylesheet" href="src/style.css?v=1789688833236" />
  <!-- Countdown digit styles (reused) -->
  <link rel="stylesheet" href="src/countdown.css?v=1789688833236" />
  <link rel="icon" type="image/png" href="https://res.cloudinary.com/dfvumcrsy/image/upload/v1753020566/kascote_white_bg_logo_qchqim.png" />

  <style>
    /* ─────────────────────────────────────────
       EVENT DETAIL PAGE — Styles
       ───────────────────────────────────────── */
    :root {
      --red:   #e61818;
      --green: #06402b;
      --dark:  #030f07;
      --mid:   #061a10;
      --text:  #e4f0e8;
      --muted: rgba(200,230,210,0.65);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--dark);
      color: var(--text);
      font-family: 'Alegreya', serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    a { text-decoration: none; color: inherit; }

    /* ── Back bar ── */
    .ed-back-bar {
      background: #020c05;
      border-bottom: 1px solid rgba(230,24,24,0.3);
      padding: 0.7rem 2rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .ed-back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'Alegreya SC', serif;
      font-size: 0.8rem;
      color: rgba(200,230,210,0.6);
      letter-spacing: 0.06em;
      transition: color 0.2s;
    }
    .ed-back-link:hover { color: var(--red); }
    .ed-back-link svg { transition: transform 0.2s; }
    .ed-back-link:hover svg { transform: translateX(-3px); }

    /* ── Hero ── */
    .ed-hero {
      position: relative;
      width: 100%;
      height: clamp(320px, 55vh, 580px);
      overflow: hidden;
      background: #030f07;
    }
    .ed-hero-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      filter: brightness(0.7);
    }
    .ed-hero-overlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to top, rgba(3,15,7,0.78) 0%, rgba(3,15,7,0.12) 55%, transparent 100%),
        linear-gradient(to right, rgba(3,15,7,0.32) 0%, transparent 60%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 3rem clamp(1.5rem, 6vw, 5rem) 2.5rem;
    }
    .ed-hero-category {
      display: inline-block;
      background: var(--red);
      color: #fff;
      font-family: 'Alegreya SC', serif;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 4px 13px;
      margin-bottom: 1rem;
      width: fit-content;
    }
    .ed-hero-title {
      font-family: 'Alegreya SC', serif;
      font-size: clamp(1.6rem, 4.5vw, 3rem);
      font-weight: 700;
      color: #fff;
      line-height: 1.2;
      max-width: 700px;
      text-shadow: 0 2px 20px rgba(0,0,0,0.6);
      margin-bottom: 1rem;
    }
    .ed-hero-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 1.2rem;
      align-items: center;
    }
    .ed-hero-meta-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'Alegreya', serif;
      font-size: 0.9rem;
      color: rgba(220,245,228,0.85);
      font-style: italic;
    }
    .ed-hero-meta-item svg { flex-shrink: 0; }

    /* ── Status badge in hero ── */
    .ed-status-live {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(230,24,24,0.95);
      color: #fff;
      font-family: 'Alegreya SC', serif;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 4px 12px;
      animation: ed-pulse 1.8s ease-in-out infinite;
    }
    .ed-status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #fff;
      animation: ed-blink 1.2s ease-in-out infinite;
    }
    @keyframes ed-pulse { 0%,100%{box-shadow:0 0 8px rgba(255,38,38,.5)} 50%{box-shadow:0 0 20px rgba(255,38,38,.9)} }
    @keyframes ed-blink  { 0%,100%{opacity:1} 50%{opacity:.15} }

    /* ── Countdown band (on detail page) ── */
    .ed-countdown-band {
      background: rgba(0,0,0,0.55);
      border-top: 2px solid var(--red);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding: 1.6rem clamp(1.5rem, 6vw, 5rem);
      display: flex;
      align-items: center;
      gap: 2rem;
      flex-wrap: wrap;
    }
    .ed-countdown-label {
      font-family: 'Alegreya SC', serif;
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    /* Reuse .event-countdown-display from countdown.css — override sizes */
    .ed-countdown-band .event-countdown-display { margin-top: 0; gap: 8px; flex-wrap: nowrap; }
    .ed-countdown-band .ec-digit-box {
      min-width: 64px;
      padding: 10px 6px 6px;
    }
    .ed-countdown-band .ec-digit-number { font-size: 1.85rem; }
    .ed-countdown-band .ec-digit-label  { font-size: 0.6rem; }
    .ed-countdown-band .ec-separator    { font-size: 1.4rem; padding-bottom: 16px; }

    /* ── Main content ── */
    .ed-main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 3rem clamp(1.5rem, 5vw, 4rem) 5rem;
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 3rem 3.5rem;
    }

    /* ── Description ── */
    .ed-section-label {
      font-family: 'Alegreya SC', serif;
      font-size: 0.68rem;
      letter-spacing: 0.15em;
      color: var(--red);
      text-transform: uppercase;
      margin-bottom: 0.6rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .ed-section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, rgba(193,0,0,0.4), transparent);
    }
    .ed-section-title {
      font-family: 'Alegreya SC', serif;
      font-size: clamp(1.2rem, 2.5vw, 1.6rem);
      color: #fff;
      margin-bottom: 1.2rem;
    }
    .ed-description {
      font-size: 1.05rem;
      line-height: 1.75;
      color: var(--muted);
      white-space: pre-line;
    }

    /* ── Sidebar info card ── */
    .ed-sidebar {
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .ed-info-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      overflow: hidden;
    }
    .ed-info-row {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      padding: 1rem 1.2rem;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .ed-info-row:last-child { border-bottom: none; }
    .ed-info-icon {
      width: 18px;
      height: 18px;
      color: var(--red);
      flex-shrink: 0;
      margin-top: 2px;
    }
    .ed-info-key {
      font-family: 'Alegreya SC', serif;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .ed-info-val {
      font-family: 'Alegreya', serif;
      font-size: 0.95rem;
      color: #e8f5ec;
      line-height: 1.45;
    }

    /* CTA block in sidebar */
    .ed-cta-block {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }
    .ed-cta-primary {
      display: block;
      text-align: center;
      padding: 13px 20px;
      background: var(--red);
      color: #fff;
      font-family: 'Alegreya SC', serif;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      border: none;
      cursor: pointer;
      transition: background 0.22s ease, box-shadow 0.22s ease;
    }
    .ed-cta-primary:hover {
      background: #a80000;
      box-shadow: 0 4px 18px rgba(193,0,0,0.45);
    }
    .ed-cta-secondary {
      display: block;
      text-align: center;
      padding: 11px 20px;
      background: transparent;
      color: var(--muted);
      font-family: 'Alegreya SC', serif;
      font-size: 0.82rem;
      letter-spacing: 0.06em;
      border: 1px solid rgba(255,255,255,0.12);
      transition: border-color 0.2s, color 0.2s;
    }
    .ed-cta-secondary:hover {
      border-color: rgba(193,0,0,0.4);
      color: #fff;
    }

    /* ── Media gallery ── */
    .ed-gallery-section {
      grid-column: 1 / -1;
    }
    .ed-media-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      margin-top: 1.2rem;
    }
    .ed-media-item {
      position: relative;
      overflow: hidden;
      background: #060f0a;
      cursor: pointer;
      aspect-ratio: 4/3;
    }
    .ed-media-item img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.45s ease, filter 0.3s ease;
    }
    .ed-media-item:hover img {
      transform: scale(1.07);
      filter: brightness(0.75);
    }
    .ed-media-item-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 0.8rem;
      background: linear-gradient(to top, rgba(3,15,7,0.85) 0%, transparent 55%);
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .ed-media-item:hover .ed-media-item-overlay { opacity: 1; }
    .ed-media-caption {
      font-family: 'Alegreya', serif;
      font-size: 0.78rem;
      color: rgba(220,245,228,0.9);
      line-height: 1.35;
    }
    .ed-media-zoom-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.7);
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
      color: #fff;
      font-size: 1.8rem;
    }
    .ed-media-item:hover .ed-media-zoom-icon {
      opacity: 0.85;
      transform: translate(-50%, -50%) scale(1);
    }

    /* Video item */
    .ed-media-item.ed-video-item {
      cursor: default;
      aspect-ratio: 16/9;
    }
    .ed-media-item.ed-video-item iframe,
    .ed-media-item.ed-video-item video {
      width: 100%; height: 100%;
      border: none;
      display: block;
    }
    .ed-video-row {
      grid-column: 1 / -1;
    }

    /* ── Lightbox ── */
    .ed-lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(0,0,0,0.94);
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .ed-lightbox.active { display: flex; }
    .ed-lightbox-inner {
      position: relative;
      max-width: 1100px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }
    .ed-lightbox-img {
      max-height: 80vh;
      max-width: 100%;
      object-fit: contain;
      display: block;
    }
    .ed-lightbox-caption {
      font-family: 'Alegreya', serif;
      font-size: 0.9rem;
      color: rgba(200,230,210,0.7);
      text-align: center;
      font-style: italic;
    }
    .ed-lightbox-close {
      position: absolute;
      top: -1rem;
      right: 0;
      background: none;
      border: none;
      color: rgba(220,245,228,0.7);
      font-size: 2rem;
      cursor: pointer;
      line-height: 1;
      transition: color 0.2s;
    }
    .ed-lightbox-close:hover { color: var(--red); }
    .ed-lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.12);
      color: #fff;
      font-size: 1.6rem;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .ed-lightbox-nav:hover {
      background: rgba(193,0,0,0.55);
      border-color: var(--red);
    }
    .ed-lightbox-prev { left: -56px; }
    .ed-lightbox-next { right: -56px; }

    /* ── 404/error ── */
    .ed-error {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      text-align: center;
      gap: 1rem;
      padding: 2rem;
    }
    .ed-error h2 {
      font-family: 'Alegreya SC', serif;
      font-size: 1.5rem;
      color: #fff;
    }
    .ed-error p { color: var(--muted); font-size: 1rem; }
    .ed-error a {
      display: inline-block;
      margin-top: 0.5rem;
      padding: 9px 22px;
      background: var(--red);
      color: #fff;
      font-family: 'Alegreya SC', serif;
      font-size: 0.85rem;
      letter-spacing: 0.06em;
    }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      .ed-main {
        grid-template-columns: 1fr;
        gap: 2rem;
        padding: 2rem 1.5rem 4rem;
      }
      .ed-gallery-section { grid-column: 1; }
      .ed-media-grid { grid-template-columns: repeat(2, 1fr); }
      .ed-countdown-band { flex-direction: column; align-items: flex-start; gap: 1rem; }
      .ed-lightbox-prev { left: 0; }
      .ed-lightbox-next { right: 0; }
    }
    @media (max-width: 560px) {
      .ed-hero { height: clamp(260px, 50vh, 380px); }
      .ed-media-grid { grid-template-columns: 1fr; }
      .ed-countdown-band .ec-digit-box { min-width: 50px; padding: 7px 4px 5px; }
      .ed-countdown-band .ec-digit-number { font-size: 1.5rem; }
    }
  </style>
</head>

  <div id="edRoot"></div>

    <div class="ed-lightbox-inner">
      <button class="ed-lightbox-close" id="lbClose" aria-label="Close">&times;</button>

      <button class="ed-lightbox-nav ed-lightbox-next" id="lbNext" aria-label="Next">&#8250;</button>
    </div>

  <script type="module">
    /* ── Helpers ── */
    function pad(n) { return String(n).padStart(2, '0'); }

    function getRemainingTime(ms) {
      const d = ms - Date.now();
      if (d <= 0) return { days:0, hours:0, minutes:0, seconds:0, expired:true };
      const ts = Math.floor(d/1000), s = ts%60, tm = Math.floor(ts/60),
            m = tm%60, th = Math.floor(tm/60), h = th%24, days = Math.floor(th/24);
      return { days, hours:h, minutes:m, seconds:s, expired:false };
    }

    function getEventState(ev) {
      const now = Date.now(), s = +new Date(ev.startDate), e = +new Date(ev.endDate);
      if (now < s) return 'upcoming';
      if (now >= s && now < e) return 'live';
      return 'ended';
    }

    function formatDate(iso) {
      return new Intl.DateTimeFormat('en-GB', {
        weekday:'long', day:'numeric', month:'long', year:'numeric'
      }).format(new Date(iso));
    }
    function formatTime(iso) {
      return new Intl.DateTimeFormat('en-GB', { hour:'2-digit', minute:'2-digit' }).format(new Date(iso));
    }

    /* ── Countdown digit builder ── */
    function buildDigit(val, lbl) {
      return `<div class="ec-unit">
        <div class="ec-digit-box" data-unit="${lbl.toLowerCase()}">
          <span class="ec-digit-number">${val}</span>
          <span class="ec-digit-label">${lbl}</span>
        </div>
      </div>`;
    }
    function buildCountdownHTML(startMs) {
      const t = getRemainingTime(startMs);
      return `
        <div class="event-countdown-display" id="edCountdownDisplay">
          ${buildDigit(pad(t.days),'Days')}
          <span class="ec-separator">:</span>
          ${buildDigit(pad(t.hours),'Hours')}
          <span class="ec-separator">:</span>
          ${buildDigit(pad(t.minutes),'Mins')}
          <span class="ec-separator">:</span>
          ${buildDigit(pad(t.seconds),'Secs')}
        </div>`;
    }

    function startCountdown(startMs) {
      const display = document.getElementById('edCountdownDisplay');
      if (!display) return;
      const units = { days: display.querySelector('[data-unit="days"] .ec-digit-number'),
                      hours: display.querySelector('[data-unit="hours"] .ec-digit-number'),
                      minutes: display.querySelector('[data-unit="mins"] .ec-digit-number'),
                      seconds: display.querySelector('[data-unit="secs"] .ec-digit-number') };
      const boxes  = { days: display.querySelector('[data-unit="days"]'),
                       hours: display.querySelector('[data-unit="hours"]'),
                       minutes: display.querySelector('[data-unit="mins"]'),
                       seconds: display.querySelector('[data-unit="secs"]') };

      function tick(boxEl) {
        boxEl.classList.add('ec-tick');
        setTimeout(() => boxEl.classList.remove('ec-tick'), 140);
      }

      let prev = getRemainingTime(startMs);
      setInterval(() => {
        const cur = getRemainingTime(startMs);
        if (cur.expired) return;
        if (cur.seconds !== prev.seconds) { units.seconds.textContent = pad(cur.seconds); tick(boxes.seconds); }
        if (cur.minutes !== prev.minutes) { units.minutes.textContent = pad(cur.minutes); tick(boxes.minutes); }
        if (cur.hours   !== prev.hours  ) { units.hours.textContent   = pad(cur.hours);   tick(boxes.hours);   }
        if (cur.days    !== prev.days   ) { units.days.textContent    = pad(cur.days);    tick(boxes.days);    }
        prev = cur;
      }, 1000);
    }

    /* ── YouTube helper ── */
    function getYouTubeId(url) {
      const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?.*v=|embed\/|shorts\/))([a-zA-Z0-9_-]{11})/);
      return m ? m[1] : null;
    }

    /* ── Render event ── */
    function renderEvent(ev) {
      const state   = getEventState(ev);
      const startMs = +new Date(ev.startDate);
      const root    = document.getElementById('edRoot');

      /* Document title */
      document.title = ev.title + ' — KASCOTE';

      /* Structured description paragraphs */
      const descParas = (ev.description || '').split('\n\n').filter(Boolean)
        .map(p => `<p class="ed-description">${p.replace(/\n/g,'<br/>')}</p>`).join('');

      /* Status badge */
      let heroBadge = '';
      if (state === 'live') {
        heroBadge = `<div class="ed-status-live">
          <span class="ed-status-dot"></span>Happening Now
        </div>`;
      }

      /* Countdown band */
      let countdownBand = '';
      if (state === 'upcoming') {
        countdownBand = `
          <div class="ed-countdown-band">
            <span class="ed-countdown-label">Starts in</span>
            ${buildCountdownHTML(startMs)}
          </div>`;
      } else if (state === 'live') {
        countdownBand = `
          <div class="ed-countdown-band" style="border-color:rgba(230,24,24,0.7);">
            <span class="ed-countdown-label" style="color:#6dffa0;">🎉 &nbsp;Event is live right now — Ends</span>
            ${buildCountdownHTML(+new Date(ev.endDate))}
          </div>`;
      }

      /* Media gallery */
      const images = (ev.media || []).filter(m => m.type === 'image');
      const videos = (ev.media || []).filter(m => m.type === 'video');

      const imageHTML = images.map((m, i) => `
        <div class="ed-media-item" data-lightbox-idx="${i}" role="button"
             tabindex="0" aria-label="View photo: ${m.caption || ''}">
          <img src="${m.src}" alt="${m.caption || ''}" loading="lazy" />
          <div class="ed-media-item-overlay">
            <span class="ed-media-caption">${m.caption || ''}</span>
          </div>
          <i class="fa-solid fa-magnifying-glass-plus ed-media-zoom-icon"></i>
        </div>`).join('');

      const videoHTML = videos.map(m => {
        const ytId = getYouTubeId(m.src);
        const inner = ytId
          ? `<iframe src="https://www.youtube.com/embed/${ytId}" title="${m.caption||'Video'}"
               allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
               allowfullscreen></iframe>`
          : `<video controls preload="metadata"><source src="${m.src}"><p>Your browser doesn't support video.</p></video>`;
        return `<div class="ed-media-item ed-video-item ed-video-row">${inner}</div>`;
      }).join('');

      const gallerySection = (images.length || videos.length) ? `
        <section class="ed-gallery-section">
          <p class="ed-section-label">Gallery &amp; Media</p>
          <h2 class="ed-section-title">Photos &amp; Videos</h2>
          <div class="ed-media-grid">
            ${imageHTML}
            ${videoHTML}
          </div>
        </section>` : '';

      /* CTA block */
      const ctaBlock = (ev.ctaLink && ev.ctaLabel)
        ? `<div class="ed-cta-block">
            <a href="${ev.ctaLink}" class="ed-cta-primary"
               ${ev.ctaLink.startsWith('http') ? 'target="_blank" rel="noopener noreferrer"' : ''}
               id="edPrimaryCtaBtn">${ev.ctaLabel}</a>
            <a href="index.html#upcoming-events" class="ed-cta-secondary">← All Events</a>
          </div>` : '';

      /* Assemble */
      root.innerHTML = `
        <!-- Hero -->
        <section class="ed-hero">
          <img class="ed-hero-img" src="${ev.image}" alt="${ev.title}" />
          <div class="ed-hero-overlay">
            <span class="ed-hero-category">${ev.category}</span>
            ${heroBadge}
            <h1 class="ed-hero-title">${ev.title}</h1>
            <div class="ed-hero-meta">
              <span class="ed-hero-meta-item">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                     stroke="#ff3333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="4" width="18" height="18" rx="0" ry="0"/>
                  <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/>
                  <line x1="3" y1="10" x2="21" y2="10"/>
                </svg>
                ${formatDate(ev.startDate)}
              </span>
              <span class="ed-hero-meta-item">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                     stroke="#ff3333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"/>
                  <polyline points="12 6 12 12 16 14"/>
                </svg>
                ${formatTime(ev.startDate)} — ${formatTime(ev.endDate)}
              </span>
              <span class="ed-hero-meta-item">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                     stroke="#ff3333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                  <circle cx="12" cy="10" r="3"/>
                </svg>
                ${ev.location}
              </span>
            </div>
          </div>
        </section>

        <!-- Countdown band -->
        ${countdownBand}

        <!-- Main -->
        <main class="ed-main">
          <!-- Description -->
          <div class="ed-content-col">
            <p class="ed-section-label">About This Event</p>
            <h2 class="ed-section-title">${ev.title}</h2>
            ${descParas || `<p class="ed-description">${ev.tagline || ''}</p>`}
          </div>

          <!-- Sidebar -->
          <aside class="ed-sidebar">
            <div class="ed-info-card">
              <div class="ed-info-row">
                <svg class="ed-info-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="4" width="18" height="18"/><line x1="16" y1="2" x2="16" y2="6"/>
                  <line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
                </svg>
                <div>
                  <p class="ed-info-key">Date</p>
                  <p class="ed-info-val">${formatDate(ev.startDate)}</p>
                </div>
              </div>
              <div class="ed-info-row">
                <svg class="ed-info-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                </svg>
                <div>
                  <p class="ed-info-key">Time</p>
                  <p class="ed-info-val">${formatTime(ev.startDate)} – ${formatTime(ev.endDate)}</p>
                </div>
              </div>
              <div class="ed-info-row">
                <svg class="ed-info-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
                </svg>
                <div>
                  <p class="ed-info-key">Location</p>
                  <p class="ed-info-val">${ev.location}</p>
                </div>
              </div>
              <div class="ed-info-row">
                <svg class="ed-info-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
                  <line x1="7" y1="7" x2="7.01" y2="7"/>
                </svg>
                <div>
                  <p class="ed-info-key">Category</p>
                  <p class="ed-info-val">${ev.category}</p>
                </div>
              </div>
            </div>
            ${ctaBlock}
          </aside>

          <!-- Gallery -->
          ${gallerySection}
        </main>
      `;

      /* Start countdown timer */
      if (state === 'upcoming') startCountdown(startMs);
      if (state === 'live') startCountdown(+new Date(ev.endDate));

      /* Lightbox */
      setupLightbox(images);
    }

    /* ── Lightbox ── */
    function setupLightbox(images) {
      if (!images.length) return;
      const lb      = document.getElementById('edLightbox');
      const lbImg   = document.getElementById('lbImg');
      const lbCap   = document.getElementById('lbCaption');
      const lbClose = document.getElementById('lbClose');
      const lbPrev  = document.getElementById('lbPrev');
      const lbNext  = document.getElementById('lbNext');
      let current   = 0;

      function show(idx) {
        current = (idx + images.length) % images.length;
        lbImg.src = images[current].src;
        lbImg.alt = images[current].caption || '';
        lbCap.textContent = images[current].caption || '';
        lb.classList.add('active');
        document.body.style.overflow = 'hidden';
      }
      function close() {
        lb.classList.remove('active');
        document.body.style.overflow = '';
        lbImg.src = '';
      }

      document.querySelectorAll('[data-lightbox-idx]').forEach(el => {
        el.addEventListener('click', () => show(+el.dataset.lightboxIdx));
        el.addEventListener('keydown', e => { if (e.key === 'Enter') show(+el.dataset.lightboxIdx); });
      });

      lbClose.addEventListener('click', close);
      lb.addEventListener('click', e => { if (e.target === lb) close(); });
      lbPrev.addEventListener('click', e => { e.stopPropagation(); show(current - 1); });
      lbNext.addEventListener('click', e => { e.stopPropagation(); show(current + 1); });
      document.addEventListener('keydown', e => {
        if (!lb.classList.contains('active')) return;
        if (e.key === 'Escape')      close();
        if (e.key === 'ArrowRight')  show(current + 1);
        if (e.key === 'ArrowLeft')   show(current - 1);
      });
    }

    /* ── Boot ── */
    async function boot() {
      const params  = new URLSearchParams(location.search);
      const eventId = params.get('id');
      const root    = document.getElementById('edRoot');

      if (!eventId) {
        root.innerHTML = `<div class="ed-error">
          <h2>No event specified</h2>
          <p>Return to the homepage to browse upcoming events.</p>
          <a href="index.html#upcoming-events">Browse Events</a>
        </div>`;
        return;
      }

      let events;
      try {
        const res = await fetch('events.json');
        if (!res.ok) throw new Error();
        events = await res.json();
      } catch {
        root.innerHTML = `<div class="ed-error">
          <h2>Could not load events</h2>
          <p>Please check your connection and try again.</p>
          <a href="index.html">Go Home</a>
        </div>`;
        return;
      }

      const ev = events.find(e => e.id === eventId);
      if (!ev) {
        root.innerHTML = `<div class="ed-error">
          <h2>Event not found</h2>
          <p>The event you're looking for may have been removed or the link may be incorrect.</p>
          <a href="index.html#upcoming-events">Browse Events</a>
        </div>`;
        return;
      }

      renderEvent(ev);
    }

    boot();
  </script>

</body>
</html>
